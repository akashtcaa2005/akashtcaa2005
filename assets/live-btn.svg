<svg xmlns="http://www.w3.org/2000/svg" width="640" height="64" viewBox="0 0 640 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#00ff9d;#00d9ff" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00ff9d"><animate attributeName="stop-color" values="#00ff9d;#00d9ff;#00ff9d" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="2" y="2" width="636" height="60" rx="30"/></clipPath>
  </defs>

  <rect x="2" y="2" width="636" height="60" rx="30" fill="#0F2027" stroke="url(#g)" stroke-width="2"/>

  <g clip-path="url(#c)">
    <rect x="-120" y="0" width="120" height="64" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" from="-160" to="680" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="135" cy="32" r="6" fill="#00ff9d"/>
  <circle cx="135" cy="32" r="6" fill="none" stroke="#00ff9d" stroke-width="2">
    <animate attributeName="r" values="6;18" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="160" y="38" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#ffffff">
    LIVE · akash-t-portfolio.netlify.app
  </text>
</svg>
