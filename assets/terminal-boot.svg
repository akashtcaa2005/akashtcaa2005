<svg width="880" height="360" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <clipPath id="c1"><rect x="38" y="48" width="0" height="24"><animate id="a1" attributeName="width" from="0" to="90" dur="0.3s" begin="0s;pause.end" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="38" y="80" width="0" height="24"><animate id="a2" attributeName="width" from="0" to="410" dur="1.37s" begin="a1.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="38" y="112" width="0" height="24"><animate id="a3" attributeName="width" from="0" to="330" dur="1.1s" begin="a2.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="38" y="144" width="0" height="24"><animate id="a4" attributeName="width" from="0" to="360" dur="1.2s" begin="a3.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="38" y="176" width="0" height="24"><animate id="a5" attributeName="width" from="0" to="395" dur="1.32s" begin="a4.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="38" y="208" width="0" height="24"><animate id="a6" attributeName="width" from="0" to="410" dur="1.37s" begin="a5.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="38" y="240" width="0" height="24"><animate id="a7" attributeName="width" from="0" to="350" dur="1.17s" begin="a6.end+0.12s" fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="38" y="272" width="0" height="24"><animate id="a8" attributeName="width" from="0" to="360" dur="1.17s" begin="a7.end+0.12s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- terminal shell -->
  <rect x="10" y="10" width="860" height="330" rx="14" fill="#0a0e14" stroke="url(#glow)" stroke-width="1.4" opacity="0.95"/>
  <rect x="10" y="10" width="860" height="32" rx="14" fill="#141a22"/>
  <rect x="10" y="26" width="860" height="16" fill="#141a22"/>
  <circle cx="32" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="26" r="6" fill="#27c93f"/>
  <text x="95" y="31" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6e7681">akash@kali:~$ ./become_god_level.sh</text>

  <!-- invisible timer that gates the restart of the whole boot sequence -->
  <rect x="0" y="0" width="0" height="0" opacity="1">
    <animate id="pause" attributeName="opacity" from="1" to="1" dur="2.6s" begin="a8.end"/>
  </rect>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <g clip-path="url(#c1)"><text x="38" y="66" fill="#00ff9d">$ whoami</text></g>
    <g clip-path="url(#c2)"><text x="38" y="98" fill="#58a6ff">akash_t :: ai engineer x bug bounty hunter</text></g>
    <g clip-path="url(#c3)"><text x="38" y="130" fill="#00ff9d">$ ./recon.sh --target=comfort_zone</text></g>
    <g clip-path="url(#c4)"><text x="38" y="162" fill="#ffd166">[+] weaknesses found: 0 (all patched)</text></g>
    <g clip-path="url(#c5)"><text x="38" y="194" fill="#00ff9d">$ python train_model.py --epochs=infinite</text></g>
    <g clip-path="url(#c6)"><text x="38" y="226" fill="#58a6ff">model.fit(curiosity, discipline) -&gt; mastery</text></g>
    <g clip-path="url(#c7)"><text x="38" y="258" fill="#00ff9d">$ git commit -m "always be building"</text></g>
    <g clip-path="url(#c8)"><text x="38" y="290" fill="#ffd166">[ok] pushed to production. shipping.<tspan fill="#00d9ff" font-weight="bold"> &#9612;<animate attributeName="opacity" values="0;1;0" dur="0.8s" begin="a8.end" repeatCount="3"/></tspan></text></g>
  </g>
</svg>
